[project]
name = "sprachassistent"
version = "0.1.0"
description = "Sprachgesteuerter Desktop-Assistent: Aufgaben, Recherche, Listen, E-Mail und Dateiablage (Claude + Microsoft 365)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.3.0",
    "msal>=1.28",
    "requests>=2.31",
    "pydantic-settings>=2.2",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "openwakeword>=0.6",
    "onnxruntime>=1.16",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
webcam = ["opencv-python-headless>=4.9"]

[project.scripts]
sprachassistent = "sprachassistent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sprachassistent*"]

[tool.setuptools.package-data]
sprachassistent = ["*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
