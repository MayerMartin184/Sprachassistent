<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c171b; --panel:#122126; --grid:#16262c; --line:#2f5a63;
    --primary:#a7e3ea; --accent:#5fb3bf; --text:#f2f7f8; --muted:#8fa4ab;
    --font:"Manrope","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono","Consolas",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(900px 420px at 50% -10%, rgba(95,179,191,.22), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      var(--bg);
    background-size:auto,44px 44px,44px 44px,auto;
    color:var(--text); font-family:var(--font); overflow:hidden; user-select:none;
  }
  .app{display:grid; grid-template-rows:auto auto 1fr auto; height:100%; padding:0 40px 26px; position:relative}
  /* Leiterbahnen */
  .traces{position:absolute; inset:0; pointer-events:none}
  .traces path{fill:none; stroke:var(--line); stroke-width:1.5}
  .traces rect{fill:var(--bg); stroke:var(--line); stroke-width:1.5}
  .traces circle{fill:var(--primary); filter:drop-shadow(0 0 6px var(--primary)); animation:pulse 3s ease-in-out infinite}
  .traces circle:nth-child(odd){animation-delay:1.4s}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  header{display:flex; align-items:center; justify-content:space-between; padding:26px 0 0; position:relative; z-index:1}
  .brand{display:flex; align-items:center; gap:18px}
  .logo{width:54px;height:54px;flex:none}
  .logo img{width:54px;height:54px;object-fit:contain}
  .wordmark{font-weight:800; font-size:28px; letter-spacing:.22em; line-height:1}
  .tagline{font-family:var(--mono); font-size:10px; letter-spacing:.32em; color:var(--primary); margin-top:8px; text-transform:uppercase}
  .tools{display:flex; align-items:center; gap:26px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted)}
  .tools button{background:none;border:0;color:var(--muted);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:6px 0}
  .tools button:hover{color:var(--text)}
  .switch{display:flex;align-items:center;gap:10px;cursor:pointer}
  .switch input{display:none}
  .switch .track{width:34px;height:18px;border:1px solid var(--line);border-radius:10px;position:relative;transition:.2s}
  .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:.2s}
  .switch input:checked + .track{border-color:var(--primary);background:rgba(167,227,234,.12)}
  .switch input:checked + .track::after{left:19px;background:var(--primary);box-shadow:0 0 8px var(--primary)}
  .switch.disabled{opacity:.4;cursor:not-allowed}
  /* Wellen */
  .stage{position:relative; z-index:1; padding:14px 0 0}
  canvas#wave{display:block;width:100%;height:170px}
  .status{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--primary);text-transform:uppercase;padding:2px 0 16px}
  .status::before{content:"";width:34px;height:1px;background:var(--primary)}
  .meter{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);text-align:center;margin-top:-10px;padding-bottom:10px;min-height:14px}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--line) 15%,var(--line) 85%,transparent)}
  /* Verlauf */
  .log{position:relative;z-index:1;overflow-y:auto;padding:18px 6px 10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;user-select:text}
  .msg{margin:0 0 18px;max-width:900px;animation:fade .25s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg .who{font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .msg .who::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 6px var(--primary)}
  .msg.you .who{color:var(--accent)} .msg.you .who::before{background:var(--accent);box-shadow:none}
  .msg.system .who{color:var(--muted)} .msg.system .who::before{background:var(--muted);box-shadow:none}
  .msg .text{font-size:15px;line-height:1.55;white-space:pre-wrap}
  .msg.system .text{color:var(--muted);font-size:13.5px}
  /* Eingabe */
  form{display:flex;gap:14px;position:relative;z-index:1;padding-top:12px}
  input[type=text]{flex:1;background:rgba(18,33,38,.9);border:1px solid var(--line);color:var(--text);font:500 15px var(--font);padding:15px 18px;outline:none;transition:.2s}
  input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),0 0 22px rgba(167,227,234,.18)}
  input::placeholder{color:var(--muted)}
  .send{background:var(--primary);color:var(--bg);border:0;font:700 11px var(--mono);letter-spacing:.26em;text-transform:uppercase;padding:0 28px;cursor:pointer;box-shadow:0 0 18px rgba(167,227,234,.35);transition:.15s}
  .send:hover{background:#c4f0f4;box-shadow:0 0 26px rgba(167,227,234,.6)}
  .send:disabled{opacity:.45;cursor:wait;box-shadow:none}
</style>
</head>
<body>
<div class="app">
  <svg class="traces" width="100%" height="100%" preserveAspectRatio="none">
    <path d="M0 150 H120 V210"/><rect x="115" y="205" width="10" height="10"/>
    <path d="M60 250 V320 H150 V400"/><rect x="145" y="395" width="10" height="10"/><circle cx="60" cy="250" r="4"/>
    <path d="M100% 130 H calc(100% - 130px)"/>
  </svg>
  <svg class="traces traces-right" width="100%" height="100%" style="transform:scaleX(-1)">
    <path d="M0 175 H140 V235"/><rect x="135" y="230" width="10" height="10"/>
    <path d="M70 280 V350 H170 V430"/><rect x="165" y="425" width="10" height="10"/><circle cx="70" cy="280" r="4"/>
  </svg>

  <header>
    <div class="brand">
      <div class="logo" id="logo">
        <svg viewBox="0 0 54 54" width="54" height="54">
          <path d="M27 3 L51 27 L27 51 L3 27 Z" fill="#122126" stroke="#a7e3ea" stroke-width="2"/>
          <path d="M31 15 L22 28 H29 L23 39 L34 24 H27 Z" fill="#a7e3ea"/>
        </svg>
      </div>
      <div>
        <div class="wordmark" id="name">JARVIS</div>
        <div class="tagline" id="tagline">Mayer E-Concept · Assistant</div>
      </div>
    </div>
    <div class="tools">
      <button id="settings" type="button">Einstellungen</button>
      <label class="switch" id="micwrap"><span>Mikrofon</span><input type="checkbox" id="mic" checked><span class="track"></span></label>
    </div>
  </header>

  <section class="stage">
    <canvas id="wave"></canvas>
    <div class="status" id="status">STARTE</div>
    <div class="meter" id="meter"></div>
    <div class="divider"></div>
  </section>

  <main class="log" id="log"></main>

  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Oder hier tippen …" autofocus>
    <button class="send" id="send" type="submit">Senden&nbsp;→</button>
  </form>
</div>

<script>
const ui = (() => {
  const $ = id => document.getElementById(id);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const canvas = $("wave"), ctx = canvas.getContext("2d");
  let state = "idle", level = 0, amp = 0.05, t = 0, name = "JARVIS";
  const TEXT = {idle:"Bereit", listening:"Sag „Hey {n}“", wake:"Ich höre", processing:"Ich arbeite", speaking:"Ich spreche", loading:"Lade Wake-Word-Modell"};

  function resize(){ const r = canvas.getBoundingClientRect(); canvas.width = r.width * devicePixelRatio; canvas.height = r.height * devicePixelRatio; }
  addEventListener("resize", resize); resize();

  function target(){
    if (state === "wake") return 0.15 + 0.85 * level;
    if (state === "listening") return 0.06 + 0.4 * level;
    if (state === "speaking") return 0.35 + 0.45 * Math.abs(Math.sin(t*3.7) * Math.sin(t*1.3)) + (Math.random()-0.5)*0.08;
    if (state === "processing") return 0.18 + 0.08 * Math.sin(t*4);
    return 0.06;
  }
  const lines = [
    {c:css("--line"),    w:1.5, f:1.6, s:1.1, p:2.1, g:0.7},
    {c:css("--accent"),  w:2,   f:2.3, s:1.7, p:0.7, g:0.85},
    {c:css("--primary"), w:2.5, f:3.1, s:2.3, p:0.0, g:1.0},
  ];
  function draw(){
    t += 0.03;
    const tg = Math.max(0.02, Math.min(1, target()));
    amp += (tg - amp) * (tg > amp ? 0.35 : 0.12);
    const W = canvas.width, H = canvas.height, mid = H/2, dpr = devicePixelRatio;
    ctx.clearRect(0,0,W,H);
    ctx.setLineDash([2*dpr, 8*dpr]); ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W*0.08, mid); ctx.lineTo(W*0.92, mid); ctx.stroke(); ctx.setLineDash([]);
    lines.forEach((L, idx) => {
      const last = idx === lines.length - 1;
      ctx.strokeStyle = last && state === "idle" ? css("--muted") : L.c;
      ctx.lineWidth = L.w * dpr; ctx.shadowBlur = last ? 14*dpr : 0; ctx.shadowColor = L.c;
      ctx.beginPath();
      for (let i = 0; i <= 160; i++){
        const x = i/160, env = Math.pow(Math.sin(Math.PI*x), 1.5);
        let y = Math.sin(x*L.f*2*Math.PI + t*L.s*2 + L.p) * (0.55 + 0.45*Math.sin(x*7 + t*0.9 + L.p));
        const px = W*0.08 + x*W*0.84, py = mid + y*env*amp*L.g*(H*0.42);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    });
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function setState(s, text){
    state = s;
    $("status").textContent = (text || TEXT[s] || s).replace("{n}", name);
  }
  function message(who, text){
    const cls = who === "System" ? "system" : who === "Du" ? "you" : "bot";
    const el = document.createElement("div"); el.className = "msg " + cls;
    const w = document.createElement("div"); w.className = "who"; w.textContent = who;
    const tx = document.createElement("div"); tx.className = "text"; tx.textContent = text;
    el.append(w, tx); $("log").append(el); $("log").scrollTop = $("log").scrollHeight;
  }
  function busy(b){ $("send").disabled = b; $("input").disabled = b; if(!b) $("input").focus(); }
  function mic(enabled, on){ $("micwrap").classList.toggle("disabled", !enabled); $("mic").disabled = !enabled; $("mic").checked = on; }
  function brand(cfg){
    name = cfg.name.toUpperCase(); $("name").textContent = name; $("tagline").textContent = cfg.title; document.title = cfg.name;
    if (cfg.logo) $("logo").innerHTML = `<img src="${cfg.logo}" alt="">`;
    Object.entries(cfg.colors || {}).forEach(([k,v]) => document.documentElement.style.setProperty("--"+k, v));
    lines[0].c = css("--line"); lines[1].c = css("--accent"); lines[2].c = css("--primary");
  }

  // Verbindung zu Python
  const api = () => window.pywebview.api;
  $("form").addEventListener("submit", async e => {
    e.preventDefault(); const v = $("input").value.trim(); if (!v) return;
    $("input").value = ""; busy(true); await api().send(v);
  });
  $("mic").addEventListener("change", e => api().set_mic(e.target.checked));
  $("settings").addEventListener("click", () => api().open_settings());
  async function poll(){
    try {
      const r = await api().poll();
      level = r.level; if (r.state !== state || r.status) setState(r.state, r.status);
      r.messages.forEach(m => message(m.who, m.text));
      if (r.busy !== undefined) busy(r.busy);
      if (r.mic) mic(r.mic.enabled, r.mic.on);
      $("meter").textContent = (r.score === null || r.score === undefined) ? "" :
        `PEGEL ${Math.round(r.level*100)}%  ·  ERKENNUNG ${r.score.toFixed(2)} / ${r.threshold.toFixed(2)}`;
    } catch (err) { /* Python noch nicht bereit */ }
    setTimeout(poll, 70);
  }
  addEventListener("pywebviewready", async () => { brand(await api().config()); poll(); });
  return {setState, message};
})();
</script>
</body>
</html>
